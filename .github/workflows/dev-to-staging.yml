name: Sync dev to staging

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write   # needed to push to staging

jobs:
  sync-dev-to-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update staging branch from dev
        run: |
          # Make sure we have all remote branches
          git fetch origin

          # Create/overwrite local staging from dev
          git checkout -B staging dev

          # Force-push staging to match dev exactly
          git push origin staging --force
