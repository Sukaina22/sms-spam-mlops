name: Build & deploy on main (production)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Only run if DockerHub secrets are configured
    if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}

    env:
      IMAGE_BACKEND: sms-api
      IMAGE_FRONTEND: sms-ui
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Backend image ----------
      - name: Build backend image
        run: |
          docker build -t $IMAGE_BACKEND -f app/Dockerfile .
          docker tag $IMAGE_BACKEND $DOCKERHUB_USERNAME/$IMAGE_BACKEND:latest
          docker tag $IMAGE_BACKEND $DOCKERHUB_USERNAME/$IMAGE_BACKEND:${{ github.sha }}

      # ---------- Frontend image ----------
      - name: Build frontend image
        run: |
          docker build -t $IMAGE_FRONTEND -f ui/Dockerfile .
          docker tag $IMAGE_FRONTEND $DOCKERHUB_USERNAME/$IMAGE_FRONTEND:latest
          docker tag $IMAGE_FRONTEND $DOCKERHUB_USERNAME/$IMAGE_FRONTEND:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push $DOCKERHUB_USERNAME/$IMAGE_BACKEND:latest
          docker push $DOCKERHUB_USERNAME/$IMAGE_BACKEND:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push $DOCKERHUB_USERNAME/$IMAGE_FRONTEND:latest
          docker push $DOCKERHUB_USERNAME/$IMAGE_FRONTEND:${{ github.sha }}

      # ---------- Deploy step (for the report) ----------
      - name: Deploy to production
        run: |
          echo "In a real setup, this step would:"
          echo "  - SSH into the production server"
          echo "  - docker pull $DOCKERHUB_USERNAME/$IMAGE_BACKEND:latest"
          echo "  - docker pull $DOCKERHUB_USERNAME/$IMAGE_FRONTEND:latest"
          echo "  - docker-compose up -d"
