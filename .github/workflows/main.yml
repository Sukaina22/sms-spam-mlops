name: CI-CD to Koyeb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to GHCR
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      # 👉 Change these image names if you want different ones
      IMAGE_BACKEND: ghcr.io/sukaina22/sms-spam-api
      IMAGE_FRONTEND: ghcr.io/sukaina22/sms-spam-ui

      # 👉 Change these to match your Koyeb app + service names
      KOYEB_BACKEND_APP: sms-spam-detector-api
      KOYEB_BACKEND_SERVICE: sms-spam-api
      KOYEB_FRONTEND_APP: sms-spam-detector-ui
      KOYEB_FRONTEND_SERVICE: sms-spam-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================
      # Build & push BACKEND image
      # ============================
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          # 👉 Change if your backend folder is not ./backend
          context: .
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Verify NEXT_PUBLIC_API_BASE_URL secret is set
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "ERROR: NEXT_PUBLIC_API_BASE_URL secret is not set"; exit 1;
          else
            echo "NEXT_PUBLIC_API_BASE_URL secret is present";
          fi

      # ============================
      # Build & push FRONTEND image
      # ============================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          # 👉 Change if your frontend folder is not ./frontend
          context: .
          file: ./ui/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # ============================
      # Install Koyeb CLI
      # ============================
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH
          $HOME/.koyeb/bin/koyeb version || true


      - name: Check Koyeb CLI access (optional)
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          koyeb --token "$KOYEB_API_TOKEN" apps list || echo "Koyeb CLI check failed, but continuing..."


      # ============================
      # Deploy BACKEND to Koyeb
      # ============================
      - name: Deploy backend service
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          echo "Updating backend service $KOYEB_BACKEND_SERVICE in app $KOYEB_BACKEND_APP ..."
          koyeb --token "$KOYEB_API_TOKEN" service update "$KOYEB_BACKEND_SERVICE" \
            --app "$KOYEB_BACKEND_APP" \
            --docker "${IMAGE_BACKEND}:${GITHUB_SHA}"


      # ============================
      # Deploy FRONTEND to Koyeb
      # ============================
      - name: Deploy frontend service
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          echo "Updating frontend service $KOYEB_FRONTEND_SERVICE in app $KOYEB_FRONTEND_APP ..."
          koyeb --token "$KOYEB_API_TOKEN" service update "$KOYEB_FRONTEND_SERVICE" \
            --app "$KOYEB_FRONTEND_APP" \
            --docker "${IMAGE_FRONTEND}:${GITHUB_SHA}"

